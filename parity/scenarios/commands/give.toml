description = "/give from the console: usage, unknown player, unknown item (named as typed, path case kept), the one-character domain quirk, amount bounds, negative damage, a stack spilling into a second slot, data tags (custom name and enchantment: italic aqua name in the hover component; quirky primitives, ignored list indices, a mismatched list element warning), tag syntax errors, the golden apple's rarity, and the fake item vanilla shows after each give"
subsystem = "commands"

# jeb_ is made operator after joining so he sees the admin messages with the item's
# hover component. Each give plays random.pop with a pitch from the player's unseeded
# random, and drops a fake item thrown with motion from the same random; it vanishes on
# its next tick. Gives are spaced so their spawn and destroy packets don't interleave.

