description = "/give leftovers: in survival, a give that only partly fits (10 of 64) and one that does not fit at all drop the rest at the player with no pickup delay, owned by him; another player standing on them cannot pick them up, the owner can once /clear makes room; in creative what does not fit vanishes (addItemStackToInventory reports success) and the fake item shows"
subsystem = "commands"

# jeb_ (made creative) fills his inventory (stone, 10 short of full). The dropped stacks are
# thrown with motion from the player's unseeded random, so where they land differs, but
# both players stand within pickup range of them.

