description = "Permissions and profile commands: op/deop, bans, IP bans, whitelist add/remove, usercache"
subsystem = "commands"

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

# Notch tries commands before being opped (t < 3 s) and again as an op (t >= 7 s).
[[steps]]
id = "notch"
action = "play"
protocol = 47
name = "Notch"
seconds = 14
background = true
chat = ["@300 /time set 0", "@600 /help", "@900 /me waves", "@1200 /list", "@7000 /time set 0", "@7300 /gamemode 1", "@7600 /help 2", "@7900 /tell Notch hi"]

[[steps]]
action = "console"
command = "whitelist add Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist list"
wait_ms = 500

[[steps]]
action = "console"
command = "op Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "deop Nobody"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon Nobody"
wait_ms = 500

[[steps]]
action = "console"
command = "ban-ip 1.2.3.4"
wait_ms = 500

[[steps]]
action = "console"
command = "banlist ips"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon-ip 1.2.3.4"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon-ip nonsense"
wait_ms = 500

[[steps]]
action = "console"
command = "ban-ip nobodyhere"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist remove Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist remove Nobody"
wait_ms = 500

[[steps]]
action = "console"
command = "op"
wait_ms = 500

[[steps]]
action = "wait"
ms = 3000

[[steps]]
action = "console"
command = "ban Notch Testing bans"
wait_ms = 800

[[steps]]
action = "console"
command = "banlist"

[[steps]]
action = "console"
command = "pardon Notch"

[observe]
log = true
files = ["ops.json", "whitelist.json", "banned-players.json", "banned-ips.json", "usercache.json"]
