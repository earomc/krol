description = "Permissions and profile commands: op/deop, bans, IP bans, whitelist add/remove, usercache"
subsystem = "commands"

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

# Notch tries commands before being opped (t < 2 s) and again as an op (t >= 9.5 s),
# after all console steps, so the two phases never interleave.
[[steps]]
id = "notch"
action = "play"
protocol = 47
name = "Notch"
seconds = 18
background = true
chat = ["@300 /time set 0", "@600 /help", "@900 /me waves", "@1200 /list", "@9500 /time set 0", "@9800 /gamemode 1", "@10100 /help 2", "@10400 /tell Notch hi", "@10600 /help 1", "@10800 /help 3", "@11000 /help 4", "@11200 /help 5", "@11400 /help 6", "@11600 /help 7", "@11800 /help 8", "@12000 /help 9"]

[[steps]]
action = "console"
command = "op"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist add Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist list"
wait_ms = 500

[[steps]]
action = "console"
command = "op Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "deop Nobody"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon Nobody"
wait_ms = 500

[[steps]]
action = "console"
command = "ban-ip 1.2.3.4"
wait_ms = 500

[[steps]]
action = "console"
command = "banlist ips"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon-ip 1.2.3.4"
wait_ms = 500

[[steps]]
action = "console"
command = "pardon-ip nonsense"
wait_ms = 500

[[steps]]
action = "console"
command = "ban-ip nobodyhere"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist remove Notch"
wait_ms = 500

[[steps]]
action = "console"
command = "whitelist remove Nobody"
wait_ms = 500


[[steps]]
action = "wait"
ms = 6500

[[steps]]
action = "console"
command = "ban Notch Testing bans"
wait_ms = 800

[[steps]]
action = "console"
command = "banlist"

[[steps]]
action = "console"
command = "pardon Notch"

[observe]
log = true
files = ["ops.json", "whitelist.json", "banned-players.json", "banned-ips.json", "usercache.json"]
