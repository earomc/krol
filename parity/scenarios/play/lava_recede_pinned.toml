description = "Lava receding with the world random pinned: a lava source spreads (deterministic), then is removed; flowing lava dries up with vanilla's random slowdowns (nextInt(4)), compared block for block mid-way"
subsystem = "play"

# No player joins, so nothing else draws from the world random after `krolpin`.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false" }
pin_random = true

[[steps]]
action = "console"
command = "setblock -470 4 -445 flowing_lava"
wait_ms = 8000

[[steps]]
action = "console"
command = "krolpin 7"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock -470 4 -445 air"
wait_ms = 4000

