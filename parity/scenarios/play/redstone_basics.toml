description = "Redstone: a lever powering three wires (15, 14, 13) into a lamp, switched on and off; a lever powering the block under a redstone torch, which turns off and turns a lamp off with it, then back on"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. Lever clicks are 1 s apart, so a short stall cannot merge a switch on
# and off into one tick.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

