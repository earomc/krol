description = "Saplings growing into trees with the world random pinned: oak, spruce, birch and jungle saplings around a standing player grow on random ticks (stage, then the tree generator), compared block for block"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. The saplings are set before
# he joins; random ticks run only after `krolpin`. Tile drops are off.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "gamerule doTileDrops false"

[[steps]]
action = "console"
command = "setblock -471 4 -441 sapling 0"

[[steps]]
action = "console"
command = "setblock -466 4 -433 sapling 1"

[[steps]]
action = "console"
command = "setblock -477 4 -433 sapling 2"

[[steps]]
action = "console"
command = "setblock -471 4 -426 sapling 3"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 32

# One command seeds the random, starts random ticks and stops them after exactly
# 500 ticks, so nothing depends on when console lines land.
[[steps]]
action = "console"
command = "krolpin 424242 300 500"
wait_ms = 29000

