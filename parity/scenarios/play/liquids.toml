command = "setblock -470 4 -460 stone keep"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock 0 300 0 stone"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock -470 4 -460 no_such_block"
wait_ms = 15000

