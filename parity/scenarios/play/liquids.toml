description = "Liquids: flowing water spreading over grass toward a hole and washing away a torch, lava spreading, lava turning into obsidian and cobblestone next to water, lava flowing onto water making stone; placed with /setblock (also its noChange, keep, outOfWorld and unknown block errors)"
subsystem = "play"

# No player joins: the spawn chunks stay loaded and run their scheduled ticks. Lava only
# uses the unseeded world random while it recedes, which never happens here.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false" }

[[steps]]
action = "console"
command = "setblock -466 3 -445 air"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock -466 2 -445 air"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock -472 4 -445 torch 5"
wait_ms = 300

[[steps]]
action = "console"
command = "setblock -470 4 -445 flowing_water"
wait_ms = 300

