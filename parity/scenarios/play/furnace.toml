description = "Furnace: placed and opened, two sticks shift-clicked into the fuel slot, one sand put into the input; it lights up, smelts glass in 200 ticks and goes out, with every window property update"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. Two sticks burn exactly as long as one item takes to smelt, so the
# furnace has settled before the window closes. The output stays in the furnace: taking
# it would spawn experience orbs at random (Math.random rounding).

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 18
chat = [
    "@2500 !creative 36 61 1 0",
    "@2800 !place -470 3 -433 1",
    "@3100 !creative 9 280 2 0",
    "@3300 !creative 10 12 3 0",
    "@3600 !place -470 4 -433 1",
    "@3900 !click 1 3 0 1 1 280 2 0",
    "@4200 !click 1 4 0 2 0 12 3 0",
    "@4500 !click 1 0 1 3 0",
    "@4800 !click 1 4 0 4 0",
    "@16000 !close 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 17700

[observe]
log = true
blocks = [[-470, 4, -433]]
tile_entities = [[-470, 4, -433]]
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
]
