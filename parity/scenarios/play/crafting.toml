description = "Crafting: planks in the 2x2 grid (shift-click on the result), a crafting table opened and a wooden pickaxe crafted in it"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console, so he can place the crafting table and take items from the creative
# inventory.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

# Random block ticks would change blocks near the player (grass dying under placed
# blocks, spreading onto exposed dirt) at random times.
[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
id = "crafter"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 11
chat = [
    "@2500 !creative 36 58 1 0",
    "@2800 !place -470 3 -433 1",
    "@3100 !creative 9 17 1 0",
    "@3400 !click 0 9 0 1 0 17 1 0",
    "@3700 !click 0 1 0 2 0",
    "@4000 !click 0 0 0 3 1 5 4 0",
    "@4300 !creative 10 5 3 0",
    "@4600 !creative 11 280 2 0",
    "@4900 !place -470 4 -433 1",
    "@5200 !click 1 11 0 4 0 5 3 0",
    "@5500 !click 1 1 1 5 0",
    "@5800 !click 1 2 1 6 0",
    "@6100 !click 1 3 1 7 0",
    "@6400 !click 1 12 0 8 0 280 2 0",
    "@6700 !click 1 5 1 9 0",
    "@7000 !click 1 8 1 10 0",
    "@7300 !click 1 0 0 11 0 270 1 0",
    "@7600 !click 1 20 0 12 0",
    "@7900 !close 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 10700

[observe]
log = true
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
]
