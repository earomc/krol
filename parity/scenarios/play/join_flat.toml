description = "Join an existing superflat world as an idle client and say hello"
subsystem = "play"

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
id = "join"
action = "play"
protocol = 47
name = "Notch"
seconds = 4
chat = ["hello world"]

[observe]
log = true
files = [
    "world/playerdata/b50ad385-829d-3141-a216-7e7d7539ba7f.dat",
    "world/stats/b50ad385-829d-3141-a216-7e7d7539ba7f.json",
]
ignore = [
    # Tick counters depend on session timing.
    "file:world/stats/b50ad385-829d-3141-a216-7e7d7539ba7f.json.value.stat.playOneMinute",
    "file:world/stats/b50ad385-829d-3141-a216-7e7d7539ba7f.json.value.stat.timeSinceDeath",
]
