description = "Mushrooms spreading on random ticks with the world random pinned: a brown and a red mushroom on a 9x9 mycelium patch (the mycelium ticks too), compared block for block"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. The blocks are set before
# he joins; random ticks run for exactly 600 ticks after `krolpin`.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "setblock -470 3 -438 mycelium"

