description = "Pressure plates: a player walking onto a stone pressure plate lights a lamp next to it (click on), walking off releases it at the plate's next recheck (click off) and the lamp goes out"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. He steps off the plate halfway between two of its 20-tick rechecks, so
# the release does not depend on timing. Moves are positions relative to the spawn.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

