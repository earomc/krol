description = "Oak saplings growing with the world random pinned, including fancy oaks (WorldGenBigTree, 1 in 10, with its own random seeded from the world's): six saplings around a standing player, compared block for block"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. The saplings are set before
# he joins; random ticks run for exactly 600 ticks after `krolpin`. Tile drops are off.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "gamerule doTileDrops false"

[[steps]]
action = "console"
command = "setblock -483 4 -446 sapling 0"

[[steps]]
action = "console"
command = "setblock -471 4 -449 sapling 0"

[[steps]]
action = "console"
command = "setblock -459 4 -446 sapling 0"

[[steps]]
action = "console"
command = "setblock -483 4 -422 sapling 0"

[[steps]]
action = "console"
command = "setblock -471 4 -419 sapling 0"

[[steps]]
action = "console"
command = "setblock -459 4 -422 sapling 0"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 38

[[steps]]
action = "console"
command = "krolpin 17 300 600"
wait_ms = 34000

