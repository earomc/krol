description = "Fall death messages (vanilla quirk): a player hit by another player (plainly, with a named sword) or by instant damage and then killed by a 30-block fall still just fell from a high place, because the fatal hit clears the earlier combat entries"
subsystem = "play"

# Dinnerbone connects first and keeps entity id 0 through his respawns; jeb_ stands
# one block south and hits him on the ground a few seconds before the first two falls,
# once the 60 ticks in which a fresh or respawned player cannot be hurt by players are
# over (respawnInvulnerabilityTicks); instant damage comes before the third, within the
# 100 ticks after which hits without an attacker are forgotten anyway. The death message
# would name the hit before the fall (death.fell.assist, .assist.item, .killer), but
# EntityPlayer.damageEntity lowers the health before CombatTracker.trackDamage, whose
# reset() then clears every earlier entry of the no longer living player: only the fall
# is left, an accident.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

# Healing between the hit and the fall would happen at a tick that depends on timing.
[[steps]]
action = "console"
command = "gamerule naturalRegeneration false"

[[steps]]
id = "victim"
