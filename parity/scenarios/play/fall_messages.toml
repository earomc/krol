[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 32
moves = [[0, 0, 0.5], [0, 0, 1.0]]
chat = [
    "@2000 !hold 0",
    "@2500 !attack 0",
    "@12500 !hold 1",
    "@13000 !attack 0",
]

[[steps]]
action = "console"
command = "give jeb_ wooden_sword"

[[steps]]
action = "console"
command = 'give jeb_ wooden_sword 1 0 {display:{Name:"Edge"}}'

[[steps]]
action = "wait"
ms = 21600

[[steps]]
action = "console"
command = "effect Dinnerbone 7 1 0"
wait_ms = 8000

[observe]
log = true
# Dinnerbone's own packets (his health updates when his movement packets are handled,
# End Combat with the ticks between jeb_'s hit and his landing) depend on how his and
# jeb_'s packets fall into ticks. jeb_'s view and the log carry what this scenario is
# about: the death messages and Dinnerbone moving to the end of the player list (the
# latency update) after each respawn.
ignore = ["victim.packets", "victim.sequence"]
# As in pvp.toml: Dinnerbone's metadata after a hit and jeb_'s equipment come in an
# order that depends on whether Dinnerbone's packet or the hit came first in the tick.
# The latency update goes out every 600 ticks, wherever that falls.
unordered = [["update_health", "entity_metadata", "entity_equipment"], ["player_list_item", "update_health"]]
