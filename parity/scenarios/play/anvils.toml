description = "Anvils: a damaged diamond sword repaired with diamonds (3 used, 2 left), renaming with MC|ItemName (the item's own name and an empty name give no output), two damaged iron swords combined, outputs taken in creative (the anvil-use effect, no damage), and in survival with 0 levels an output that cannot be taken"
subsystem = "play"

# jeb_ is creative while taking outputs, so the anvil's 12% damage chance (drawn from the
# player's unseeded random) never applies. Outputs carry a RepairCost tag the bot cannot
# predict, so taking them is rejected and confirmed (in vanilla too).

[setup]
world = "fixtures/worlds/flat"
