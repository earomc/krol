description = "Dispensers and droppers: a dropper moving one item into the chest in front per rising edge (lever on, off, on), and a dispenser dropping an item (with its click and smoke effects)"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. Facing south, he places the dropper and dispenser facing north, away
# from him; the dispensed item lands out of his reach. Actions are 250 ms apart and
# start after the console made him creative.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 13
chat = [
    "@2500 !creative 36 54 1 0",
    "@2750 !creative 37 158 1 0",
    "@3000 !creative 38 23 1 0",
    "@3250 !creative 39 69 8 0",
    "@3500 !creative 9 4 3 0",
    "@3750 !creative 10 3 2 0",
    "@4000 !place -474 3 -434 1",
    "@4250 !hold 1",
    "@4500 !place -474 3 -433 1",
    "@4750 !hold 2",
    "@5000 !place -477 3 -433 1",
    "@5250 !hold 3",
    "@5500 !place -473 3 -433 1",
    "@5750 !place -478 3 -433 1",
    "@6000 !place -474 4 -433 1",
    "@6250 !click 1 9 0 1 0 4 3 0",
    "@6500 !click 1 0 0 2 0",
    "@6750 !close 1",
    "@7000 !place -477 4 -433 1",
    "@7250 !click 2 10 0 1 0 3 2 0",
    "@7500 !click 2 4 0 2 0",
    "@7750 !close 2",
    "@8000 !place -473 4 -433 1",
    "@8250 !place -473 4 -433 1",
    "@8500 !place -473 4 -433 1",
    "@8750 !place -478 4 -433 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 12700

[observe]
log = true
blocks = [[-474, 4, -433], [-477, 4, -433]]
tile_entities = [[-474, 4, -434], [-474, 4, -433], [-477, 4, -433]]
