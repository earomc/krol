# Found by `cargo xtask parity fuzz --seed 1 --steps 20` (shrunk to 2 steps): a player
# logging out with a stack on the cursor drops it (EntityPlayer#setDead closes the
# containers). The item is saved untouched because vanilla notices the closed connection
# in the network phase after the worlds ticked, and the harness's `stop` runs at the end
# of that same tick.
description = "Logging out with a stack on the cursor drops it (found by parity fuzz)"
subsystem = "inventory"

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "1" }

# A fixed position (creative players get a random spawn offset otherwise).
[setup.files]
"world/playerdata/b50ad385-829d-3141-a216-7e7d7539ba7f.dat" = "fixtures/playerdata/notch_creative.dat"

# Random block ticks change grass at random; drops fly off with unseeded motion.
[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "gamerule doTileDrops false"

[[steps]]
id = "bot"
action = "play"
protocol = 47
name = "Notch"
