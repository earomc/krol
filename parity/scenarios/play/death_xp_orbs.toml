description = "A player killed at level 5 drops 35 experience as orbs 20 updates later; the dead body stays among the world's players until it respawns, so the orbs are spawned to it again after it left the world and keep flying to it (the closest player), never reaching another player 3 blocks away"
subsystem = "entity"

# Both players spawn at (-471.5, 4, -434.5) in adventure mode; jeb_ is then teleported 3
# blocks east. Player packets run in arrival order at the start of a tick, so a collector
# standing on the death spot could pick an orb up before or after the body leaves the
# world (in that tick's entity loop) depending on which packet arrived first, in vanilla
# too; from 3 blocks away nothing races. Vanilla quirk: the dead body is still one of the
# world's players, so the tracker spawns the new orbs to it again, and the orbs pick it
# as their closest player. `krolpin` pins Math.random() (the orbs' motion) in the tick of
# the kill.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
id = "victim"
action = "play"
background = true
protocol = 47
name = "Notch"
seconds = 12

[[steps]]
id = "picker"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 10

[[steps]]
action = "console"
command = "tp jeb_ -468.5 4 -434.5"
wait_ms = 1000

[[steps]]
action = "console"
command = "xp 5L Notch"
wait_ms = 1500

[[steps]]
action = "console"
command = "krolpin 3 -- kill Notch"
wait_ms = 6000

[observe]
log = true
