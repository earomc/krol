description = "Hoppers: eight coal put into a chest flow through a hopper below it (one item per 8 ticks) into the side of a furnace (its fuel slot)"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. Dirt blocks are placed and broken so that no placement click lands on an
# inventory (that would open it). The transfer finishes well before the server stops.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 12
chat = [
    "@2500 !creative 36 3 8 0",
    "@2700 !creative 37 54 1 0",
    "@2900 !creative 38 154 1 0",
    "@3100 !creative 39 61 1 0",
    "@3300 !creative 9 263 8 0",
    "@3500 !place -469 3 -433 1",
    "@3700 !place -468 3 -433 1",
    "@3900 !hold 1",
    "@4100 !place -469 4 -433 1",
    "@4300 !dig -469 4 -433 1",
    "@4500 !hold 2",
    "@4700 !place -468 4 -433 4",
    "@4900 !dig -468 4 -433 1",
    "@5100 !hold 3",
    "@5300 !place -468 3 -433 1",
    "@5600 !place -469 5 -433 1",
    "@5900 !click 1 27 0 1 0 263 8 0",
    "@6200 !click 1 0 0 2 0",
    "@6500 !close 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 11700

[observe]
log = true
blocks = [[-469, 5, -433], [-469, 4, -433], [-468, 4, -433]]
tile_entities = [[-469, 5, -433], [-469, 4, -433], [-468, 4, -433]]
