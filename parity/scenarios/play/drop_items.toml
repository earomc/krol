description = "Dropping one item (Q) and the rest of the stack (Ctrl+Q) while looking down; the drops merge and are picked up again"
subsystem = "entity"

# Looking straight down keeps the drops at the player's feet, so they are picked up when
# their 40-tick pickup delay ends.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[setup.files]
"world/playerdata/5627dd98-e6be-3c21-b8a8-e92344183641.dat" = "fixtures/playerdata/steve.dat"
"world/playerdata/b50ad385-829d-3141-a216-7e7d7539ba7f.dat" = "fixtures/playerdata/notch_away.dat"

# Random block ticks would change blocks near the player (grass dying under placed
# blocks, spreading onto exposed dirt) at random times.
[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
id = "watcher"
action = "play"
background = true
protocol = 47
name = "Notch"
seconds = 9

[[steps]]
id = "steve"
action = "play"
protocol = 47
name = "Steve"
seconds = 6
chat = [
    "@800 !look 0 90",
    "@1200 !dig 0 0 0 0 4",
    "@1700 !dig 0 0 0 0 3",
]

[observe]
log = true
files = [
    "world/playerdata/5627dd98-e6be-3c21-b8a8-e92344183641.dat",
    "world/stats/5627dd98-e6be-3c21-b8a8-e92344183641.json",
]
ignore = [
    "file:world/playerdata/5627dd98-e6be-3c21-b8a8-e92344183641.dat.XpSeed",
    "file:world/playerdata/5627dd98-e6be-3c21-b8a8-e92344183641.dat.foodTickTimer",
    "file:world/stats/5627dd98-e6be-3c21-b8a8-e92344183641.json.value.stat.playOneMinute",
    "file:world/stats/5627dd98-e6be-3c21-b8a8-e92344183641.json.value.stat.timeSinceDeath",
]
