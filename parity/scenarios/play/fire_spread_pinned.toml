description = "Fire spreading over a planks platform with the world random pinned (krolpin): fire ages, spreads to the air around flammable blocks, burns planks away, block for block like vanilla"
subsystem = "play"

# No player joins: nothing else draws from the world random (no active chunks, no mob
# spawning), so after `krolpin` both servers make the same random choices. Fire only
# runs on scheduled ticks here (random block ticks need a player nearby).

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false" }
pin_random = true

