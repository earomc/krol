description = "Leads breaking: a pig tied to a fence whose fence is dug out drops its lead when the knot breaks at its next surface check (every 101 ticks); a pig led by a player who gets more than 10 blocks away is pulled and breaks free, dropping the lead"
subsystem = "entity"

# jeb_ joins at the spawn (-471.5, 4, -434.5) in adventure mode (no random spawn
# offset), is switched to survival and gets two pig eggs (hotbar slot 0) and three leads
# (slot 1) as /give drops 1 and 2. A fence stands east of him (F1, -470 4 -434), and a
# glass cell (one block, walls two high) 2 blocks north of him. The pigs hatch from his
# eggs on the bot's clock: `krolpin spawns 13` pins their randoms and `krolpin world 21
# 600` the world random (their facing, the fence's drop). Pig A hatches 3 blocks south
# of him (-471.5, 4, -431.5), pig B in the cell (-471.5, 4, -436.5), where glass hides
# it (he reaches it within 3 blocks) and keeps it from following him.
#
# He leashes A and ties it to F1 (knot 5), digs F1 out by hand (60 ticks; the fence
# drops as entity 6) before the knot's first surface check 101 ticks after it was tied,
# so the knot breaks at that check and A drops its lead (entity 7) in the next tick.
# Then he leashes B and steps 9.5 blocks south in one movement packet (under the 10
# blocks of "moved too quickly"): B, now 11.5 blocks away, is pulled against its cell
# and breaks free, dropping the lead (entity 8).
#
# The follow range bonus is drawn before the pin and its modifier's UUID comes from
# ThreadLocalRandom, so both are left out of the saved pigs.

[setup]
world = "fixtures/worlds/flat"
pin_random = true
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "true", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

# Animals are only kept with spawn-animals on; natural spawning stays off.
[[steps]]
action = "console"
command = "gamerule doMobSpawning false"

[[steps]]
action = "console"
command = "setblock -470 4 -434 fence"

[[steps]]
action = "console"
command = "fill -473 4 -438 -471 5 -436 glass"

[[steps]]
action = "console"
command = "fill -472 4 -437 -472 5 -437 air"

