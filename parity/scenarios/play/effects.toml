description = "Status effects with /effect: regeneration at full health, instant damage and instant health II, absorption (4 extra health), night vision with hidden particles given and taken, clear (and its failure), unknown effects; effect packets, particle color metadata, NBT"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. Effects that act over
# time (poison, hunger) act once per movement packet, so only instant effects and ones
# that do nothing visible are used.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 18

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"
wait_ms = 2500

[[steps]]
action = "console"
command = "effect jeb_ regeneration 5 1"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ instant_damage"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ instant_health 1 1"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ 22 10"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ night_vision 60 0 true"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ night_vision 0"
wait_ms = 1500

[[steps]]
action = "console"
command = "effect jeb_ night_vision 0"
wait_ms = 500

[[steps]]
action = "console"
command = "effect jeb_ clear"
wait_ms = 1000

[[steps]]
action = "console"
command = "effect jeb_ clear"
wait_ms = 500

[[steps]]
action = "console"
command = "effect jeb_ 99"
wait_ms = 500

[[steps]]
action = "console"
command = "effect jeb_ nonsense"
wait_ms = 500

[[steps]]
action = "console"
command = "effect jeb_ 0"
wait_ms = 3000

[observe]
log = true
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
]
