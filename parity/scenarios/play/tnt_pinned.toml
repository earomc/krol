description = "TNT with the world random and Math.random() pinned: powered by a redstone block in the tick of the pin, the primed TNT hops, explodes after 80 ticks and blasts a crater compared block for block, setting off a second TNT with a short random fuse; the standing player is hurt and knocked back (explosion packet with its knockback, health, velocity)"
subsystem = "play"

# jeb_ joins at the spawn (-471.5, 4, -434.5) in adventure mode and stands still, about
# 5.5 blocks west of the TNT. `krolpin` pins World.rand and Math.random() and places the
# redstone block in the same tick, so the TNT's motion (Math.random), its 80-tick fuse,
# the explosion's 1352 ray strengths and the drop rolls (World.rand) line up exactly.
# Tile drops are off so no item can be picked up at a moment that depends on packet
# timing; the drop rolls still happen.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"


[[steps]]
action = "console"
command = "setblock -466 4 -434 tnt"

[[steps]]
action = "console"
command = "setblock -462 4 -434 tnt"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 12

# Pinned only once jeb_ has joined: his arrival changes the active chunks, and every
# active chunk draws from World.rand each tick.
[[steps]]
action = "console"
command = "gamerule doTileDrops false"
wait_ms = 3000

[[steps]]
action = "console"
command = "krolpin 7 -- setblock -466 4 -433 redstone_block"
wait_ms = 9000

