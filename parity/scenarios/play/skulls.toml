description = "Mob heads: a skeleton skull on the floor, a wither skeleton skull on a wall (facing east), a zombie head in place of tall grass, a player head with a textured SkullOwner (kept as given, no profile lookup) and a creeper head (tile entities with SkullType, Rot and Owner, update tile entity action 4); the creeper and player heads mined in survival drop again (the player head with its SkullOwner), the zombie head broken in creative drops nothing (NODROP)"
subsystem = "blocks"

# jeb_ joins at the spawn (-471.5, 4, -434.5, block column -472, -435) in adventure mode
# (no spawn offset) and is made survival from the console. The heads go into the cells
# around his column inside a two-high stone ring, so the mined heads land within his
# pickup reach wherever they fly. /give hands items over a tick later, so the clicks
# wait until all five have arrived. The player head's profile has textures, so vanilla
# keeps it without asking the profile cache or the session server.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "fill -474 4 -437 -470 5 -433 stone"

[[steps]]
action = "console"
command = "fill -473 4 -436 -471 5 -434 air"

[[steps]]
action = "console"
command = "setblock -472 4 -436 tallgrass 1"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 17
chat = [
    "@5000 !place -471 3 -436 1",
    "@5400 !hold 1",
    "@5600 !place -474 4 -435 5",
    "@6000 !hold 2",
    "@6200 !place -472 4 -436 1",
    "@6600 !hold 3",
    "@6800 !place -471 3 -435 1",
    "@7200 !hold 4",
    "@7400 !place -471 3 -434 1",
    "@7800 !dig -471 4 -434 1",
    "@9400 !dig -471 4 -434 1 2",
    "@9600 !dig -471 4 -435 1",
    "@11200 !dig -471 4 -435 1 2",
    "@15000 !dig -472 4 -436 1",
]

[[steps]]
action = "wait"
ms = 1200

[[steps]]
action = "console"
command = "gamemode 0 jeb_"

[[steps]]
action = "console"
command = "give jeb_ skull 1 0"

[[steps]]
action = "console"
command = "give jeb_ skull 1 1"

[[steps]]
action = "console"
command = "give jeb_ skull 1 2"

[[steps]]
action = "console"
command = 'give jeb_ skull 1 3 {SkullOwner:{Name:"Notch",Id:"069a79f4-44e9-4726-a5be-fca90e38aaf5",Properties:{textures:[{Value:"abc"}]}}}'

[[steps]]
action = "console"
command = "give jeb_ skull 1 4"
wait_ms = 9500

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 5000

[observe]
log = true
blocks = [[-471, 4, -436], [-473, 4, -435], [-472, 4, -436], [-471, 4, -435], [-471, 4, -434]]
tile_entities = [[-471, 4, -436], [-473, 4, -435]]
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.XpSeed",
]
