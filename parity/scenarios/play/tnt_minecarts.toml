description = "TNT minecarts: placed on rails (spawn object 10 with type 3); one broken at rest by a sword (a minecart and TNT dropped, no explosion); with the world random pinned, one lit by its activator rail getting powered (entity status 10, the fuse sound) explodes 80 ticks later with strength 4 (sparing rails and the blocks under them; its center inside the rail, every exposure ray ends on the rail, so a second TNT cart 2 blocks away and the player 5 blocks away take only the minimum damage); the crater compared block for block"
subsystem = "entity"

# jeb_ (entity 0) joins at the spawn in adventure mode, is switched to survival and
# teleported to (-476.5, 4, -432.5), and gets three TNT minecarts (hotbar slots 0-2, they
# do not stack) and a sword (slot 3) as /give drops 1 and 2. Along z = -433 he places the
# TNT cart T1 (entity 3) on an unpowered activator rail at x = -472, T2 (entity 4) on a
# rail at x = -470 and T3 (entity 5) on a rail at x = -482, all within the 8 blocks
# placing allows, and breaks T3 with the sword: it rests, so it only drops a minecart and
# TNT (entities 6 and 7, at random spots 10 blocks or more from the explosions, killed at
# the end). The console then turns tile drops off (the drop rolls still happen) and,
# well after the bot placed T1, pins the randoms while a redstone block under T1's rail
# powers it. T1 lights in that tick and explodes 80 ticks later; resting carts always
# explode with strength 4, so the cart's own (unpinned) random does not matter. The blast
# center lies inside the activator rail's selection box, which every exposure ray of
# getBlockDensity ends on: T2 and jeb_ are hit with exposure 0 (1 damage), so T2 wobbles
# but survives on its spared rail.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "setblock -472 4 -433 activator_rail"

[[steps]]
action = "console"
command = "setblock -470 4 -433 rail"

[[steps]]
action = "console"
command = "setblock -482 4 -433 rail"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 21
chat = [
    "@4500 !hold 0",
    "@4800 !place -472 4 -433 1",
    "@5300 !hold 1",
    "@5600 !place -470 4 -433 1",
    "@6100 !hold 2",
    "@6400 !place -482 4 -433 1",
    "@6900 !hold 3",
    "@7200 !attack 5",
]

[[steps]]
action = "console"
command = "gamemode 0 jeb_"

[[steps]]
action = "console"
command = "tp jeb_ -476.5 4 -432.5"

[[steps]]
action = "console"
command = "give jeb_ tnt_minecart 3"

[[steps]]
action = "console"
command = "give jeb_ diamond_sword 1"
wait_ms = 300

[[steps]]
action = "console"
command = "gamerule doTileDrops false"
wait_ms = 8000

[[steps]]
action = "console"
command = "krolpin 7 -- setblock -472 3 -433 redstone_block"
wait_ms = 6000

[[steps]]
action = "console"
command = "kill @e[type=Item]"
wait_ms = 1000

[observe]
log = true
# /kill lists the items it kills by their distance from the console (the origin), and
# where T3's drops end up is random.
log_ignore_prefixes = ["Killed item."]
entities = [[-30, -28]]
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodExhaustionLevel",
]
