description = "Acacia and dark oak saplings growing with the world random pinned: two acacias (WorldGenSavannaTree), a 2x2 of dark oak saplings (WorldGenCanopyTree) and a lone dark oak sapling that never grows, compared block for block"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. The saplings are set before
# he joins; random ticks run for exactly 600 ticks after `krolpin`. Tile drops are off.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "gamerule doTileDrops false"

[[steps]]
action = "console"
command = "setblock -483 4 -446 sapling 4"

[[steps]]
action = "console"
command = "setblock -459 4 -446 sapling 4"

[[steps]]
action = "console"
command = "setblock -483 4 -421 sapling 5"

[[steps]]
action = "console"
command = "setblock -471 4 -422 sapling 5"

[[steps]]
action = "console"
command = "setblock -470 4 -422 sapling 5"

[[steps]]
action = "console"
command = "setblock -471 4 -421 sapling 5"

[[steps]]
action = "console"
command = "setblock -470 4 -421 sapling 5"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 38

[[steps]]
action = "console"
command = "krolpin 8 300 600"
wait_ms = 34000

