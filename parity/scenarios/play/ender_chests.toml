description = "Ender chests: two placed, items shift-clicked into one and taken out through the other (one shared ender inventory, saved as EnderItems), lid block events and their 20-tick resync, a third under a stone block that does not open; all three broken (creative) at the end"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. The stone is set before he joins: console commands land at wall-clock
# times, which would interleave at random with the chests' 20-tick block events. The
# chests are broken between their resyncs (placed at 2.8, 5.3 and 7.0 s, so they resync
# about 0.8, 0.3 and 0.0 s into each second) so the session does not end amid them.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "setblock -473 5 -433 stone"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 10
chat = [
    "@2500 !creative 36 130 3 0",
    "@2800 !place -470 3 -433 1",
    "@3100 !creative 9 4 9 0",
    "@3300 !creative 10 3 5 0",
    "@3600 !place -470 4 -433 1",
    "@3900 !click 1 27 0 1 1 4 9 0",
    "@4200 !click 1 28 0 2 1 3 5 0",
    "@4500 !close 1",
    "@5300 !place -467 3 -433 1",
    "@5600 !place -467 4 -433 1",
    "@5900 !click 2 0 0 1 1 4 9 0",
    "@6200 !close 2",
    "@7000 !place -473 3 -433 1",
    "@7600 !place -473 4 -433 1",
    "@8150 !dig -473 4 -433 1",
    "@8550 !dig -467 4 -433 1",
    "@9300 !dig -470 4 -433 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 9700

[observe]
log = true
blocks = [[-470, 4, -433], [-467, 4, -433], [-473, 4, -433], [-473, 5, -433]]
tile_entities = [[-470, 4, -433], [-467, 4, -433], [-473, 4, -433]]
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
]
