description = "Pistons: a piston failing to push stone-slime-stone (the slime block drags the ground below past the 12-block limit), a sticky piston pushing and pulling a block back, and a piston powered only through the block above it (quasi-connectivity) that extends when a neighbor update reaches it"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. He looks west, so the pistons he places face east. The third piston's
# lever is diagonal to it: switching the lever on gives the piston no update, so it only
# extends when a block is placed next to it. The first piston cannot move its line: the
# slime block also pulls the grass under it, which brings more ground than 12 blocks.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

