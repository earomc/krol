description = "Block updates: a lever flipped on and off, stone and wooden buttons pressed (released by scheduled ticks after 20 and 30 ticks), and a flower, a torch and a lever popping off when the block under them is broken"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode (no spawn offset) and is made creative from
# the console. The blocks that pop off are more than two blocks from the player, so
# their drops land out of pickup reach whatever their random arc.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 11
chat = [
    "@2500 !creative 36 69 1 0",
    "@2800 !place -470 3 -433 1",
    "@3100 !place -470 4 -433 1",
    "@3400 !place -470 4 -433 1",
    "@3700 !creative 37 77 1 0",
    "@3900 !hold 1",
    "@4200 !place -468 3 -433 1",
    "@4500 !place -468 4 -433 1",
    "@4800 !creative 38 143 1 0",
    "@5000 !hold 2",
    "@5300 !place -466 3 -433 1",
    "@5600 !place -466 4 -433 1",
    "@6000 !creative 39 38 1 0",
    "@6200 !hold 3",
    "@6400 !place -475 3 -433 1",
    "@6700 !creative 40 50 1 0",
    "@6900 !hold 4",
    "@7100 !place -476 3 -433 1",
    "@7400 !hold 0",
    "@7600 !place -475 3 -431 1",
    "@8000 !dig -475 3 -433 1",
    "@8300 !dig -476 3 -433 1",
    "@8600 !dig -475 3 -431 1",
]

[[steps]]
action = "console"
command = "gamemode 1 jeb_"
wait_ms = 10700

[observe]
log = true
blocks = [[-470, 4, -433], [-468, 4, -433], [-466, 4, -433], [-475, 4, -433], [-476, 4, -433], [-475, 4, -431]]
files = [
    "world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat",
    "world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json",
]
ignore = [
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.playOneMinute",
    "file:world/stats/a762f560-4fce-3236-812a-b80efff0b62b.json.value.stat.timeSinceDeath",
    "file:world/playerdata/a762f560-4fce-3236-812a-b80efff0b62b.dat.foodTickTimer",
