description = "Firework and banner recipes in the 2x2 grid: a firework star (gunpowder, red dye, gold nugget: star shape), a rocket from gunpowder, paper and the star, a curly border on a white banner from a vine (no dye: black), and the pattern copied onto a plain white banner, which keeps the original in the grid"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and is made creative from the console. The
# crafted stars, rockets and banners carry NBT the bot does not predict, so those clicks
# are rejected and confirmed (the items still move).

