description = "2x2 spruce and jungle saplings growing with the world random pinned into a mega spruce (WorldGenMegaPineTree, without block updates) and a mega jungle tree (WorldGenMegaJungle, with branches and vines), compared block for block"
subsystem = "play"

# jeb_ joins at the spawn in adventure mode and stands still. The saplings are set before
# he joins; random ticks run for exactly 600 ticks after `krolpin`. Tile drops are off.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2", view-distance = "3" }
pin_random = true

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "gamerule doTileDrops false"

[[steps]]
action = "console"
command = "setblock -483 4 -446 sapling 1"

[[steps]]
action = "console"
command = "setblock -482 4 -446 sapling 1"

[[steps]]
action = "console"
command = "setblock -483 4 -445 sapling 1"

[[steps]]
action = "console"
command = "setblock -482 4 -445 sapling 1"

[[steps]]
action = "console"
command = "setblock -459 4 -446 sapling 3"

[[steps]]
action = "console"
command = "setblock -458 4 -446 sapling 3"

[[steps]]
action = "console"
command = "setblock -459 4 -445 sapling 3"

[[steps]]
action = "console"
command = "setblock -458 4 -445 sapling 3"

[[steps]]
id = "player"
action = "play"
background = true
protocol = 47
name = "jeb_"
seconds = 38

[[steps]]
action = "console"
command = "krolpin 8 300 600"
wait_ms = 34000

