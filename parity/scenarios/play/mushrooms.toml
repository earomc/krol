description = "Mushrooms: placed on mycelium but not on grass in daylight, popping off when their mycelium turns to stone, and bone meal growing a brown and a red huge mushroom (stems compared; the heights are random); a sunflower placed as two halves"
subsystem = "blocks"

# Notch (survival, from fixture data: bone meal in slot 1, mushrooms in slots 2 and 3,
# sunflowers in slot 4) stands at the spawn (-471.5, 4, -434.5). Bone meal grows a
# huge mushroom 40% of the time; ten tries each leave a 0.6% chance of no growth.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[setup.files]
"world/playerdata/b50ad385-829d-3141-a216-7e7d7539ba7f.dat" = "fixtures/playerdata/notch_gardener.dat"

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "setblock -468 3 -433 mycelium"

[[steps]]
action = "console"
command = "setblock -475 3 -433 mycelium"

[[steps]]
action = "console"
command = "setblock -478 3 -438 mycelium"

[[steps]]
action = "console"
command = "setblock -478 4 -438 brown_mushroom"

