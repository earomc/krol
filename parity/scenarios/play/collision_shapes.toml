description = "Collision shapes: walking east and back through lanes with a lone fence, a door facing west, a closed bottom trapdoor (stepped onto), east-facing stairs (climbed), a lone glass pane, a lone cobblestone wall and a fence gate facing east; the server's collision results show in its position corrections"
subsystem = "physics"

# jeb_ joins at the spawn (-471.5, 4, -434.5) in adventure mode. Each lane's obstacle is
# at x = -469; the bot claims to walk 4 blocks east and back regardless, so wherever the
# server's collision result differs from the claim, vanilla sends a correction.

[setup]
world = "fixtures/worlds/flat"
properties = { online-mode = "false", level-type = "FLAT", generate-structures = "false", spawn-animals = "false", spawn-monsters = "false", spawn-npcs = "false", allow-nether = "false", gamemode = "2" }

[[steps]]
action = "console"
command = "gamerule randomTickSpeed 0"

[[steps]]
action = "console"
command = "setblock -469 4 -435 fence"

[[steps]]
action = "console"
command = "setblock -469 4 -437 wooden_door 2"

[[steps]]
action = "console"
command = "setblock -469 5 -437 wooden_door 8"

[[steps]]
action = "console"
command = "setblock -469 4 -439 trapdoor 0"

[[steps]]
