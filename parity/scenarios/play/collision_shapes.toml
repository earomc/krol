command = "setblock -469 4 -441 oak_stairs 0"

[[steps]]
action = "console"
command = "setblock -469 4 -443 glass_pane"

[[steps]]
action = "console"
command = "setblock -469 4 -445 cobblestone_wall"

[[steps]]
action = "console"
command = "setblock -469 4 -447 fence_gate 3"

