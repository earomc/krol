[[feature]]
id = "blocks.tool_wear"
description = "ItemStack.onBlockDestroyed when mining in survival: tools wear by 1 and swords by 2 on blocks that are not instantly broken, shears by 1 on leaves, cobwebs, tall grass, vines, tripwire and wool; use statistics; broken tools leave the hand; shears harvesting tall grass, dead bushes, leaves and vines (the block itself, no exhaustion). Not yet: double plants"
scenarios = ["play/tool_wear"]

[[feature]]
id = "blocks.planting"
description = "Planting: ItemSeeds and ItemSeedFood (wheat, pumpkin and melon seeds, carrots and potatoes on farmland, nether wart on soul sand; top face, air above, no sound) and ItemReed block items (sugar cane by water, cake on solid ground) with their place sounds and use statistics. Not yet: cocoa beans, other ItemReed items"
