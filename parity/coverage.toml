# Vanilla feature -> parity scenario map (AGENTS.md §10.2).
#
# `cargo xtask parity coverage` lists every feature as COVERED (all scenarios pass),
# OPEN (scenarios exist but fail / have no golden) or UNCOVERED (no scenario yet).
# Agents: pick an OPEN or UNCOVERED entry, write/extend a scenario, record vanilla,
# implement, iterate until green.

# --- Startup & configuration -------------------------------------------------------

[[feature]]
id = "config.eula.first_run"
description = "Missing eula.txt is created; server refuses to start"
scenarios = ["startup/first_run_no_eula"]

[[feature]]
id = "config.server_properties.defaults"
description = "server.properties completed with defaults, vanilla key order"
scenarios = ["startup/fresh_properties"]

[[feature]]
id = "config.server_properties.invalid_values"
description = "Unparsable ints replaced by defaults, booleans kept, clamping"
scenarios = []

[[feature]]
id = "config.ops_whitelist_bans"
description = "ops.json, whitelist.json, banned-*.json written at startup"
scenarios = ["startup/user_lists"]

[[feature]]
id = "login.bans_whitelist"
description = "Banned / not-whitelisted / IP-banned login refusals"
scenarios = ["login/bans_and_whitelist"]

[[feature]]
id = "config.usercache"
description = "usercache.json"
scenarios = ["commands/profiles"]

[[feature]]
id = "startup.log"
description = "Startup and shutdown console log lines"
scenarios = []

