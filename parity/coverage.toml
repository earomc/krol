[[feature]]
id = "blocks.placement_orientation"
description = "Block placement rules: logs/pillars by face, stairs and slabs by yaw and click height, slab merging, torches, ladders, furnaces, chests (neighbors), pumpkins, gates, anvils, pistons, hoppers, trapdoors, plant support"
