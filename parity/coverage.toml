[[feature]]
id = "blocks.furnaces"
description = "Furnaces: tile entity, window with fuel/input/output slot rules and shift-click, burning and cooking timers, lit/unlit block swap keeping the tile entity, window properties, smelting recipes extracted from vanilla"
scenarios = ["play/furnace"]

[[feature]]
id = "blocks.signs"
description = "Signs: standing and wall placement, sign editor, Update Sign handling (formatting stripped, editable by the placer), sign text and other tile entity data sent after block changes and chunk sends"
scenarios = ["play/signs"]

[[feature]]
id = "entities.xp_orbs"
description = "Experience orbs: spawning (splits), tracking, flying to the nearest player, collection (cooldown, sound, experience); experience from furnace output and mined ores"
scenarios = ["play/xp_orbs"]

[[feature]]
id = "play.special_recipes"
description = "Special crafting recipes: item repair, leather armor dyes, book cloning, map cloning and extending (unit tests); per-recipe remaining items. Not yet: fireworks, banner patterns"
scenarios = ["play/special_recipes"]

[[feature]]
id = "blocks.updates"
description = "Block updates: setBlockState flags, neighbor notifications in vanilla order, scheduled block ticks (order, limit, TileTicks save/load), plants/torches/signs/ladders/levers/buttons popping off, levers and buttons (placement, activation, button release ticks)"
scenarios = ["play/levers_buttons"]

[[feature]]
id = "entities.falling_blocks"
description = "Falling sand and gravel: scheduled checks on placement and neighbor changes, falling block entities (tracking, physics, landing, dropping as items), instant fall in unloaded areas. Not yet: anvils, dragon eggs"
scenarios = ["play/falling_blocks"]

[[feature]]
id = "redstone.basics"
description = "Redstone power queries (strong/weak, normal cubes relaying), redstone wire (power levels, connections, update order via HashSet<BlockPos> order), redstone torches (delay, burnout), lamps; levers, buttons and redstone blocks as sources. Not yet: repeaters, comparators, pistons, power-driven doors and the other consumers"
scenarios = ["play/redstone_basics"]

[[feature]]
id = "redstone.repeaters"
description = "Repeaters: placement facing away from the player, delay cycling, delays and tick priorities, locking by powered side repeaters, output to the front, block update marking after onBlockAdded/breakBlock"
scenarios = ["play/repeaters"]

[[feature]]
id = "redstone.doors"
description = "Doors, trapdoors and fence gates opened and closed by redstone (powered bits, effects 1003/1006), doors and trapdoors breaking without support, door halves breaking together, doors dropping from the lower half"
scenarios = ["play/powered_doors"]

[[feature]]
id = "redstone.comparators"
description = "Comparators: compare/subtract modes, side inputs, reading chests (whole double chest, nothing when blocked) and furnaces directly or through a cube, output signal tile entity, scheduled updates, containers updating nearby comparators. Not yet: hoppers, dispensers, brewing stands, jukeboxes, cauldrons, cake, end portal frames, item frames"
scenarios = ["play/comparators"]

[[feature]]
id = "redstone.pistons"
description = "Pistons and sticky pistons: structure helper (12-block limit, slime blocks, destroyable blocks), block events, moving blocks with tile entities, heads, quasi-connectivity, sounds. Not yet: moving entities"
scenarios = ["play/pistons"]

[[feature]]
id = "redstone.note_blocks"
description = "Note blocks: tuning, instruments by the block below, playing on right-click, survival left-click and rising redstone edges, Music tile entity, block events and sounds"
scenarios = ["play/note_blocks"]

[[feature]]
id = "redstone.pressure_plates"
description = "Pressure plates (stone, wooden, weighted): entity-block collisions after every move (doBlockCollisions), sensitive area, rechecks every 20/10 ticks, click sounds, power to neighbors and strongly into the block below"
scenarios = ["play/pressure_plates"]

[[feature]]
id = "redstone.hoppers"
description = "Hoppers: pulling from the inventory above or item entities, pushing into the inventory they face (furnace sides, double chests, other hoppers), 8-tick cooldown, redstone lock, window, comparator signal, contents dropped when broken. Not yet: minecarts, dispensers, droppers, brewing stands"
scenarios = ["play/hoppers"]

[[feature]]
id = "redstone.dispensers"
description = "Dispensers and droppers: rising-edge trigger (also through the block above), 4-tick delay, random slot, default dispensing with effects, droppers inserting into the inventory in front, windows, comparator signal, hopper access. Not yet: the special dispense behaviors (projectiles, buckets, bone meal, TNT, armor, ...)"
scenarios = ["play/dispensers"]

[[feature]]
id = "world.lighting"
description = "Lighting: sky and block light updates on block changes (checkLightFor with vanilla's queue and reach), height map and column relighting, sky light maps for new sections, gap rechecks on chunk ticks; light block properties extracted from vanilla"
scenarios = ["play/lighting"]

[[feature]]
id = "world.random_ticks"
description = "Random block ticks: active chunks in vanilla order, updateLCG positions, randomTickSpeed, skylightSubtracted; grass/mycelium spreading and dying, farmland, crops, stems, sugar cane, cactus, ice and snow melting, redstone ore, nether wart, plants without soil; farmland, cactus and snow layer placement. Saplings growing into spruce, birch, oak and small jungle trees (WorldGenTaiga2, WorldGenForest, WorldGenTrees with vines and cocoa) fancy oaks (WorldGenBigTree), acacia (WorldGenSavannaTree) dark oak from 2x2 saplings (WorldGenCanopyTree), mega spruce and mega jungle trees (WorldGenMegaPineTree without block updates, WorldGenMegaJungle), vines growing and falling off, mushrooms spreading, cocoa growing. Not yet: lightning, freezing and snowfall"
scenarios = ["play/random_ticks"]

[[feature]]
id = "parity.pin_random"
description = "The parity suite pins vanilla's world random and random tick generator (parity/vanilla-agent, krolpin) to compare random-driven behavior exactly; fire spreading, lava receding and random block ticks (grass spreading) compared block for block; the cave mood countdown is modeled and pinned too"
scenarios = ["play/fire_spread_pinned", "play/lava_recede_pinned", "play/random_ticks_pinned", "play/saplings_pinned", "play/oaks_pinned", "play/savanna_trees_pinned", "play/mega_trees_pinned"]

[[feature]]
id = "world.leaf_decay"
description = "Leaf decay: breaking logs (radius 4) and leaves (radius 1) marks leaves to check, the random tick's distance check through leaves (4 blocks from a log), decay with vanilla's sapling and apple drops, player-placed leaves never decaying (and keeping the check mark)"
scenarios = ["play/leaf_decay"]

[[feature]]
id = "world.liquids"
description = "Liquids: water and lava flow (levels, falling columns, new sources, flow toward the nearest drop, washing away blocks), lava hardening into obsidian, cobblestone and stone next to water with the fizz sound. Not yet: lava setting fire, the nether's faster lava, entities in liquids"
scenarios = ["play/liquids"]

[[feature]]
id = "entity.water_movement"
description = "Entities in water: handleWaterMovement (surface height, flow vector, push of 0.014 per tick for players not flying and for items), fall distance reset, entry splash, swim sounds on steps, swim statistics. Not yet: items and orbs in lava, extinguishing"
scenarios = ["play/water_push"]

[[feature]]
id = "entity.drowning"
description = "Air supply: isInsideOfMaterial (eye height against the water surface), air going down under water (respiration), drowning damage every 20 ticks without air (no knockback), refill on surfacing, hurtTime, the death update dropping a dead player's experience after 20 ticks. Not yet: removing the dead body from trackers"
scenarios = ["play/drowning"]

[[feature]]
id = "world.fire"
description = "Fire: support rules, ageing and burning out, spreading and burning flammable blocks (vanilla encouragement/flammability table, difficulty, humid biomes), dying in the rain (canLightningStrike with precipitation height and biome weather), netherrack; flint and steel with item wear (unbreaking, breaking), punching out fire (extinguishFire). Not yet: TNT, portals"
scenarios = ["play/fire"]

[[feature]]
id = "entity.burning"
description = "Burning players: the fire counter (Fire), damage every 20 ticks, fire and lava contact (dealFireDamage, catching fire after the fire resistance), lava damage and 15 s of fire, fire protection, putting it out in water or rain (fizz), the burning metadata flag; still lava setting fire near flammable blocks; flowing liquids' random ticks. Not yet: armor, burning items and mobs"
scenarios = ["play/lava"]

[[feature]]
id = "blocks.tool_wear"
description = "ItemStack.onBlockDestroyed when mining in survival: tools wear by 1 and swords by 2 on blocks that are not instantly broken, shears by 1 on leaves, cobwebs, tall grass, vines, tripwire and wool; use statistics; broken tools leave the hand; shears harvesting tall grass, dead bushes, leaves and vines (the block itself, no exhaustion). Not yet: double plants, silk touch, fortune"
scenarios = ["play/tool_wear"]

[[feature]]
id = "blocks.planting"
description = "Planting: ItemSeeds and ItemSeedFood (wheat, pumpkin and melon seeds, carrots and potatoes on farmland, nether wart on soul sand; top face, air above, no sound) and ItemReed block items (sugar cane by water, cake on solid ground) with their place sounds and use statistics. Not yet: cocoa beans, other ItemReed items"
scenarios = ["play/planting"]

[[feature]]
id = "blocks.farming_tools"
description = "Hoes (ItemHoe: grass and dirt to farmland, coarse dirt to dirt, the new block's step sound, wear) and bone meal (ItemDye.applyBonemeal on crops, stems and saplings: 2-5 stages, 45% sapling growth, used up whenever the plant can grow, effect 2005), on grass (BlockGrass.grow: 128 attempts, biome flowers via pickRandomFlower), tall grass and ferns (double plants) and double plants (a copy dropped); double plants breaking as a pair (BlockDoublePlant.checkAndDropBlock). Cocoa (BlockCocoa: ItemDye placement on jungle logs, random growth, bone meal, drops). The exact spots grass bone meal fills are random and not compared"
scenarios = ["play/tilling", "play/bone_meal", "play/bone_meal_plants", "play/cocoa"]

[[feature]]
id = "blocks.mushrooms"
description = "Mushrooms (BlockMushroom): placement and staying rules (mycelium, podzol, or a full block in light below 13), spreading on random ticks (crowding, the random walk), bone meal growing huge mushrooms 40% of the time (WorldGenBigMushroom, the inside-block quirk), huge mushroom drops. The huge mushroom caps are compared only by their stems (random heights); sunflowers placed as two halves"
scenarios = ["play/mushrooms", "play/mushrooms_pinned"]

[[feature]]
id = "entity.armor"
description = "Armor: armor points reducing blockable damage, armor wear (a quarter of the damage, boots first), protection, fire protection and feather falling (getEnchantmentModifierDamage), equipping armor with a right-click. Not yet: the resistance potion, blast and projectile protection, sword blocking, pumpkins and skulls as helmets, thorns"
scenarios = ["play/armor"]

[[feature]]
id = "item.food"
description = "Eating: food values extracted from vanilla (tools/datagen/FoodDump.java), canEat, setItemInUse (eating flag, eat animation), eating sounds every 4 updates, status 9, burp, hunger and saturation, stews leaving a bowl, letting go early, no held-item resync for items with a use duration, inventory resend when refused. Golden apples (absorption, regeneration; enchanted: resistance and fire resistance), food effects (chicken, rotten flesh, spider eye, poisonous potato, pufferfish), milk clearing effects, cake slices by right- and left-click (cakeSlicesEaten), cake falling off without support. Not yet: drinking potions, bows, sword blocking"
scenarios = ["play/eating", "play/golden_apple_milk", "play/cake"]

[[feature]]
id = "entity.effects"
description = "Status effects: the effect table extracted from vanilla (tools/datagen/PotionDump.java), adding and combining, ticking (regeneration, poison, wither, hunger, saturation, instant health and damage), absorption, effect packets (with vanilla's show-particles byte), particle color and ambient metadata, ActiveEffects NBT, /effect with its messages and errors. Not yet: attribute effects (speed, slowness, strength, weakness, health boost), invisibility, effect particles' random draws, potions, beacons"
scenarios = ["play/effects"]

[[feature]]
id = "entity.attributes"
description = "Player attributes: base values, modifiers (operations 0-2, clamping), the sprinting speed boost, effect modifiers (speed, slowness, strength, weakness, health boost with max health), entity properties with modifiers (watched attributes only, HashSet order), Attributes with Modifiers in player data"
scenarios = ["play/attribute_effects"]

[[feature]]
id = "item.buckets"
description = "Buckets: use-item packets (face 255), the server's block ray trace, filling and emptying water and lava buckets in survival (stack handling, statistics, inventory resend). Not yet: milk, creative use, selection boxes of stairs, fences and other shaped blocks"
scenarios = ["play/buckets"]

[[feature]]
id = "commands.setblock"
description = "/setblock: block names, data values, replace/destroy/keep, relative coordinates, noChange, outOfWorld, coordinate bounds and unknown block errors. Not yet: data tags"
scenarios = ["play/liquids"]

[[feature]]
id = "blocks.containers"
description = "Other container GUIs (brewing stands, enchanting tables, anvils, beacons, ...): open window, slots, clicks, closing"
scenarios = []

[[feature]]
id = "play.inventory_clicks"
description = "Player window clicks: pick up/place/split, outside drops, shift-click, number keys, drag painting, double click, creative clone, rejected predictions and confirmation, closing"
scenarios = ["play/inventory_clicks"]

[[feature]]
id = "play.crafting"
description = "Crafting: recipe table extracted from vanilla, 2x2 grid, crafting table window (open, clicks, result, close), stat.craftItem, stat.useItem"
scenarios = ["play/crafting"]

[[feature]]
id = "entity.suffocation"
description = "Suffocation: Entity.isEntityInsideOpaqueBlock (8 points around the eyes, isVisuallyOpaque from the extracted block table), inWall damage of 1 (bypasses armor, no exhaustion), the death message. Not yet: world border damage"
scenarios = ["play/suffocation"]
