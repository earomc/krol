[[feature]]
id = "entity.items"
description = "Item entities: block drops, spawn/metadata/velocity, physics, pickup (collect, pop sound, inventory), destroy; pushOutOfBlocks (records popping out inside a jukebox)"
scenarios = ["play/survival_mining", "play/jukeboxes"]

[[feature]]
id = "items.maps"
description = "Maps: ItemEmptyMap from a stack of two (map 0 centered on its cell, idcounts.dat, the filled map added, the use counted), the held map drawn per movement packet (block map colors, height shading, water depth, the checkered rim), S34PacketMaps (the whole map, changed rectangles, the player icon every fifth call), map_0.dat with the colors (compared by hash); maps in item frames (play/framed_maps: the frame icon, the tracker's map packets every 10 ticks sharing the viewer's call count with the carried copy, the icon removed when the map is knocked out). Not yet: zooming in a scenario, larger scales, Decorations lists on items, frames seen by players who never carried the map"
scenarios = ["play/maps", "play/framed_maps"]

[[feature]]
id = "blocks.beacon"
description = "Beacons: pyramid levels and the beam check (updateBeacon on a neighbor change and every 80 ticks), the window (container.beacon, window properties once, stat.beaconInteraction), the payment slot by shift-click, MC|Beacon setting the powers and using up the payment, ambient effects for players in range. Not yet: stained glass above, custom names, the payment dropped on close"
scenarios = ["play/beacons"]

[[feature]]
id = "blocks.skull"
description = "Mob heads: ItemSkull.onItemUse on the floor, a wall and in place of a replaceable block (facing, Rot, SkullType, Owner from a textured SkullOwner), update tile entity action 4, the head dropped by breakBlock when mined (with SkullOwner), none after a creative break (NODROP), the '%s's Head' item name. Not yet: profile lookups for SkullOwner names, wither summoning"
scenarios = ["play/skulls"]

[[feature]]
id = "blocks.jukebox"
description = "Jukeboxes and records: ItemRecord.onItemUse (effect 1005 with the record id, has_record set quietly, stat.recordPlayed, the record used up), taking the record out (effect 1005 with 0, the record popping out above), comparators reading the record number, a jukebox destroyed by /setblock dropping itself and then its record (breakBlock). Not yet: the old numeric Record tag, /setblock data tags"
scenarios = ["play/jukeboxes"]

[[feature]]
id = "entity.throwables"
description = "EntityThrowable: ItemSnowball/ItemEnderPearl.onItemRightClick (the stack shrinks, random.bow, stat.useItem, the inventory resync), spawn object 61/65 with metadata, flight (block ray trace, the thrower ignored for 5 ticks, drag, gravity), the impact killing the entity (destroy entities); the ender pearl teleporting its thrower and dealing 5 fall damage. Not yet in a scenario: eggs (an unpinned 1-in-8 chick roll), experience bottles (their experience rolls on the world random), hits on entities, saving with the chunk, creative throwers"
scenarios = ["play/throwables"]

[[feature]]
id = "entity.arrows"
description = "ItemBow and EntityArrow: drawing a bow (the use flag), releasing at full power (spawn object 60 with the shooter's id as data, critical metadata in the data watcher's HashMap order, random.bow, bow wear, the arrow used up, stat.useItem.bow), the arrow sticking in a wall in its first tick (random.bowhit, the first change packet with every entry), pickup (collect, random.pop, the arrow item), a kill by arrow (death.attack.arrow, arrow count metadata, change game state 6, knockback from the shooter). Not yet in a scenario: partial power, power/punch/flame/infinity, arrows bouncing off, falling out of changed blocks, saving with the chunk, creative pickup"
scenarios = ["play/bows"]

[[feature]]
id = "entity.hanging"
description = "EntityPainting and EntityItemFrame: ItemHangingEntity.onItemUse (on the side of a block, the item used up), spawn painting (title, hanging position, facing) and spawn object 71 at the hanging position with the facing as data, base metadata; a frame that does not fit (the entity id used up anyway, the item kept, the use statistic); hits and uses through glass within 3 blocks; an item put into a frame (the first change packet with every entry, the held slot resynced on the next player update), turned by eighths (only the rotation), knocked out by a hit (dropped, the frame stays) and the frame broken by a second hit (destroy entities, the frame dropped); a comparator reading a frame through a block (block change, OutputSignal); a painting popping off when its wall goes (the surface check every 101 updates, the painting dropped); a frame saved with its chunk (Item, ItemRotation, ItemDropChance, Facing, TileX/Y/Z). Not yet in a scenario: projectiles and explosions breaking hanging entities, creative players breaking them (no drops), doEntityDrops, invulnerable ones, loading, /tp. Maps in frames: play/framed_maps"
scenarios = ["play/hanging", "play/framed_maps"]

[[feature]]
id = "entity.armor_stands"
description = "EntityArmorStand and ItemArmorStand: placing on the ground (on top of the clicked block; refused where an entity stands, no entity id used), spawn object 78 with data 0, metadata (silent, health, flags, the pose: the random head and body turn masked), attributes (generic.movementSpeed 0.7, generic.maxHealth), velocity; a first punch only marking it, a second within 5 ticks knocking it over (destroy entities, the stand dropped); fire set into it on netherrack (burning flag, health down by 0.15 a tick, never by 4: the fire counter quirk), breaking with nothing dropped; the stand left standing saved with its chunk (living fields, Attributes, Equipment, Pose, DisabledSlots, flags). Equipment: armor put on by interacting at a point (helmet at the head, chestplate at the chest, equipment packets), a sword refused without arms, the helmet taken back with an empty hand, an EntityTag (ShowArms, Small) merged into a new stand, a sword put into its hand and dropped with the stand. Not yet in a scenario: arrows, explosions, creative players, markers, invisible stands, disabled slots, loading, /tp, water and ladders"
scenarios = ["play/armor_stands", "play/armor_stand_equipment"]

[[feature]]
id = "entity.splash_potions"
