[[feature]]
id = "world.lighting"
description = "Lighting: sky and block light updates on block changes (checkLightFor with vanilla's queue and reach), height map and column relighting, sky light maps for new sections, gap rechecks on chunk ticks; light block properties extracted from vanilla"
scenarios = ["play/lighting"]

[[feature]]
id = "world.random_ticks"
description = "Random block ticks: active chunks in vanilla order, updateLCG positions, randomTickSpeed, skylightSubtracted; grass/mycelium spreading and dying, farmland, crops, stems, sugar cane, cactus, ice and snow melting, redstone ore, nether wart, plants without soil; farmland, cactus and snow layer placement. Saplings growing into spruce, birch, oak and small jungle trees (WorldGenTaiga2, WorldGenForest, WorldGenTrees with vines and cocoa) fancy oaks (WorldGenBigTree), acacia (WorldGenSavannaTree) dark oak from 2x2 saplings (WorldGenCanopyTree), mega spruce and mega jungle trees (WorldGenMegaPineTree without block updates, WorldGenMegaJungle), vines growing and falling off, mushrooms spreading, cocoa growing. Not yet: lightning, freezing and snowfall"
scenarios = ["play/random_ticks"]

[[feature]]
id = "parity.pin_random"
description = "The parity suite pins vanilla's world random and random tick generator (parity/vanilla-agent, krolpin) to compare random-driven behavior exactly; fire spreading, lava receding and random block ticks (grass spreading) compared block for block; the cave mood countdown is modeled and pinned too"
scenarios = ["play/fire_spread_pinned", "play/lava_recede_pinned", "play/random_ticks_pinned", "play/saplings_pinned", "play/oaks_pinned", "play/savanna_trees_pinned", "play/mega_trees_pinned"]

[[feature]]
id = "world.leaf_decay"
description = "Leaf decay: breaking logs (radius 4) and leaves (radius 1) marks leaves to check, the random tick's distance check through leaves (4 blocks from a log), decay with vanilla's sapling and apple drops, player-placed leaves never decaying (and keeping the check mark)"
scenarios = ["play/leaf_decay"]

[[feature]]
id = "world.liquids"
description = "Liquids: water and lava flow (levels, falling columns, new sources, flow toward the nearest drop, washing away blocks), lava hardening into obsidian, cobblestone and stone next to water with the fizz sound. Not yet: lava setting fire, the nether's faster lava, entities in liquids"
