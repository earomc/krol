[[feature]]
id = "redstone.dispensers"
description = "Dispensers and droppers: rising-edge trigger (also through the block above), 4-tick delay, random slot, default dispensing with effects, droppers inserting into the inventory in front, windows, comparator signal, hopper access. Not yet: the special dispense behaviors (projectiles, buckets, bone meal, TNT, armor, ...)"
