[[feature]]
id = "item.food"
description = "Eating: food values extracted from vanilla (tools/datagen/FoodDump.java), canEat, setItemInUse (eating flag, eat animation), eating sounds every 4 updates, status 9, burp, hunger and saturation, stews leaving a bowl, letting go early, no held-item resync for items with a use duration, inventory resend when refused. Golden apples (absorption, regeneration; enchanted: resistance and fire resistance), food effects (chicken, rotten flesh, spider eye, poisonous potato, pufferfish), milk clearing effects, cake slices by right- and left-click (cakeSlicesEaten), cake falling off without support. Not yet: drinking potions, bows, sword blocking"
scenarios = ["play/eating", "play/golden_apple_milk", "play/cake"]

[[feature]]
id = "entity.effects"
description = "Status effects: the effect table extracted from vanilla (tools/datagen/PotionDump.java), adding and combining, ticking (regeneration, poison, wither, hunger, saturation, instant health and damage), absorption, effect packets (with vanilla's show-particles byte), particle color and ambient metadata, ActiveEffects NBT, /effect with its messages and errors. Not yet: attribute effects (speed, slowness, strength, weakness, health boost), invisibility, effect particles' random draws, potions, beacons"
scenarios = ["play/effects"]

[[feature]]
id = "entity.attributes"
description = "Player attributes: base values, modifiers (operations 0-2, clamping), the sprinting speed boost, effect modifiers (speed, slowness, strength, weakness, health boost with max health), entity properties with modifiers (watched attributes only, HashSet order), Attributes with Modifiers in player data"
scenarios = ["play/attribute_effects"]

[[feature]]
id = "item.buckets"
description = "Buckets: use-item packets (face 255), the server's block ray trace, filling and emptying water and lava buckets in survival (stack handling, statistics, inventory resend). Not yet: milk, creative use, selection boxes of stairs, fences and other shaped blocks"
scenarios = ["play/buckets"]

[[feature]]
id = "commands.setblock"
description = "/setblock: block names, data values, replace/destroy/keep, relative coordinates, noChange, outOfWorld, coordinate bounds and unknown block errors. Not yet: data tags"
scenarios = ["play/liquids"]

[[feature]]
id = "blocks.containers"
description = "Other container GUIs (brewing stands, enchanting tables, anvils, beacons, ...): open window, slots, clicks, closing"
scenarios = []

[[feature]]
id = "play.inventory_clicks"
description = "Player window clicks: pick up/place/split, outside drops, shift-click, number keys, drag painting, double click, creative clone, rejected predictions and confirmation, closing"
scenarios = ["play/inventory_clicks"]

[[feature]]
id = "play.crafting"
description = "Crafting: recipe table extracted from vanilla, 2x2 grid, crafting table window (open, clicks, result, close), stat.craftItem, stat.useItem"
scenarios = ["play/crafting"]

[[feature]]
id = "entity.suffocation"
description = "Suffocation: Entity.isEntityInsideOpaqueBlock (8 points around the eyes, isVisuallyOpaque from the extracted block table), inWall damage of 1 (bypasses armor, no exhaustion), the death message. Not yet: world border damage"
scenarios = ["play/suffocation"]

[[feature]]
id = "entity.block_collisions"
description = "Entity.doBlockCollisions effects on movement: cobwebs (setInWeb: the next move covers 0.25/0.05/0.25 of the distance and stops the motion, fall distance reset), soul sand (horizontal motion times 0.4 per block touched) for players, items, XP orbs and falling blocks; new players placed above collision boxes only (not above cobwebs or plants). Soul sand and items in cobwebs have no scenario yet (their effect shows in random item arcs)"
scenarios = ["play/cobwebs"]

[[feature]]
id = "blocks.reactions"
description = "Small block reactions: farmland trampled on landing (BlockFarmland.onFallenUpon with the faller's random), redstone ore lighting up on left-click, right-click and walking (onEntityCollidedWithBlock of the block walked on, particle draws on the world random), ice turning into flowing water when harvested above something solid or liquid (BlockIce.harvestBlock), slime slowing walkers"
scenarios = ["play/block_reactions"]

[[feature]]
id = "physics.collision_shapes"
description = "Block collision shapes (addCollisionBoxesToList / getCollisionBoundingBox): stairs with inner and outer corners, fences, walls and panes connecting to their neighbors, doors (halves read each other), trapdoors, fence gates by axis, ladders, cauldrons, hoppers, brewing stands, end portal frames, skulls, cocoa, piston heads, cake, flower pots, dragon eggs. Not yet: anvils and double chests (vanilla uses the bounds a ray trace last left on the block)"
scenarios = ["play/collision_shapes"]

[[feature]]
id = "world.explosions"
description = "Explosions and TNT: rays with block resistance (data extracted from vanilla), the affected HashSet order and the explosion packet, drops rolled with 1/strength, entity damage by exposure (getBlockDensity) with difficulty scaling and blast protection, knockback, primed TNT (Math.random motion, fuse, tracking), chain reactions with short random fuses, priming by redstone, flint and steel and breaking explode-marked TNT; entities spawned during the entity loop update in the same tick. Not yet: fire charges, dispensers, burning arrows, flaming explosions, mobs"
scenarios = ["play/tnt_pinned", "play/tnt_lit"]

[[feature]]
id = "blocks.beds"
description = "Beds: ItemBed placement (facing, two halves, solid tops), BlockBed activation (head lookup, occupied bit set with flag 4, tile.bed.noSleep / tile.bed.occupied), trySleep (lying position, use bed to viewers and self), the sleep timer, waking (leave-bed animation, safe exit spot, spawn point), the night skip when everyone is fully asleep (time, weather reset), halves breaking together with drops from the foot, respawning at the bed or the missing-bed message (clonePlayer drops the spawn point). Not yet: mobs keeping players awake, beds exploding outside the overworld, the sleeping box size"
scenarios = ["play/beds", "play/beds_broken"]

[[feature]]
id = "commands.clear_kill_spawnpoint"
description = "/clear (matching by item resource location and data, maxCount counting and limits, main inventory then armor then cursor, failure), /spawnpoint (feet or coordinates, forced spawn points used on respawn), /kill (out-of-world damage: harms creative players, bypasses respawn protection; getEntity errors; other entities set dead). Not yet: data tags"
scenarios = ["commands/clear_kill_spawnpoint", "commands/entity_targets"]

[[feature]]
id = "commands.entity_targets"
description = "Commands on non-player entities: dropped items' names, /tp in every form (entities and players, relative flags, rotation wrapping and flipping), /effect on a non-living entity (invalid UUID quirk), /kill, score_ filters on entities (scores under their UUID, removed with the dead entity), per-entity command runs by UUID"
scenarios = ["commands/entity_targets"]

[[feature]]
id = "commands.summon"
description = "/summon: usage, outOfWorld (unloaded chunk, outside the build height), unknown ids (failed, 'Skipping Entity' warning), tagError, coordinates centered on the block, the legacy Minecart id with its Type, entities built from data tags (Air and Health read as 0 when missing; the watcher re-sent once) and spawned at once (tracked in the chunk they join, saved with it). Not yet: mobs other than pigs, Riding mounts, LightningBolt (onInitialSpawn of a tagless summon: play/spawn_eggs)"
scenarios = ["commands/summon"]

[[feature]]
id = "entity.mobs.no_ai"
description = "Mobs without AI (pigs with NoAI): spawn mob packet with the watcher's HashMap order, metadata and attributes resent at the first update, the ambient sound on the mob's own random, a player's hit (hurt status and sound, sword wear, health metadata, recentlyHit), knockback resistance from the Attributes tag, /kill (death sound and status, raw porkchops, experience 20 ticks later from the world random, stat.mobKills), death by burning (fire damage, burning flag, cooked porkchops, no experience), custom names, Saddle, Silent and NoAI saved with the chunk. Not yet: knockback velocities (their tracker phase depends on timing), looting, equipment drops"
scenarios = ["play/mobs_no_ai"]

[[feature]]
id = "entity.mobs.spawn_animals_off"
description = "spawn-animals=false: animals are set dead in WorldServer.updateEntityWithOptionalForce and still run that update (a burning pig takes its first fire damage)"
scenarios = ["play/mobs_animals_off"]

[[feature]]
id = "entity.mobs.ai"
description = "Pigs with AI: the goal selector (EntityAITasks: tick rate 3, priorities, mutex bits, the executing order), wander (RandomPositionGenerator with EntityAnimal.getBlockPathWeight, idle limit), look idle, watch closest player, panic while burning, swimming; ground navigation (PathFinder heap and WalkNodeProcessor, path following with straight cuts, stuck checks), the move, look, jump and body helpers, moveEntityWithHeading (ground acceleration by slipperiness, air, water), falls (fall sounds, damage, dust), steps (mob.pig.step), fire contact, despawn idle time; vanilla's box normalization (small entities' water boxes turn inside out into real ones). Not yet: leads"
scenarios = ["play/mobs_ai"]

[[feature]]
id = "entity.mobs.follow_parent"
description = "EntityAIFollowParent: a piglet (half size, higher sounds, swimming out of a pool) follows the nearest adult of its kind within 8/4/8, a path every 10 ticks to its feet, the closest point when it cannot be reached"
scenarios = ["play/mobs_follow_parent"]

[[feature]]
id = "entity.mobs.tempt"
description = "EntityAITempt: the nearest player within 10 blocks holding a carrot is looked at and followed (path to his feet, 1.2 times the speed, the navigator not avoiding water) until 2.5 blocks away"
scenarios = ["play/mobs_tempt"]

[[feature]]
id = "entity.mobs.breeding"
description = "Players using items on mobs (EntityPlayer.interactWith): a carrot puts an adult pig in love (status 18, InLove 600, the feeder remembered) or makes a piglet grow by a tenth of its time (func_175501_a, ForcedAge), nothing on a pig in love; saddles (adult pigs only, mob.horse.leather) and named name tags (CustomName, PersistenceRequired), used up outside creative; EntityAIMate: a pig in love finds the closest partner in love within 8 blocks, walks up to it and after 60 ticks within 3 blocks the child is born at its feet (Age -24000, facing south), the parents rest (Age 6000), hearts drawn from the parent's random, an experience orb of 1 to 7, the feeder's stat.animalsBred. Spawn eggs used on a pig of their kind (a child, named after the egg) are implemented but not covered; leads are missing"
scenarios = ["play/mobs_breed"]

[[feature]]
id = "entity.mobs.riding"
description = "Riding saddled pigs: a click on a saddled pig mounts the player (EntityPig.interact), who sits three quarters up it; EntityAIControlledByPlayer while he holds a carrot on a stick (it turns towards his look by up to 5 degrees a tick, speeds up towards 0.3 by 1% a tick, jumps where WalkNodeProcessor's box check finds a block ahead with room above, wears the stick by 1 with a 0.6% chance a tick outside creative, walks with moveEntityWithHeading on top of its own travel); the stick's right click boosts it (140 to 980 ticks, 7 uses, a worn-out stick becomes a fishing rod) and counts its use; the unmount input gets him off; the distance ridden (stat.pigOneCm); the pig saved in his data (Riding) and back when he joins; a pig that never walked has no move speed and cannot be steered. Not covered: the stick turning into a fishing rod, the rider drowning off a pig, the flyPig achievement (achievements are missing)"
scenarios = ["play/mobs_riding"]

[[feature]]
id = "item.spawn_eggs"
description = "Spawn eggs (ItemMonsterPlacer): onItemUse hatches the egg's mob in front of the clicked face (the half block lift on top of fences never applies: vanilla tests the block state with instanceof BlockFence), onItemRightClick aimed at a liquid hatches it in the liquid's block; spawnCreature: facing wrapAngleTo180(world rand nextFloat * 360) with head and body, onInitialSpawn (followRange 'Random spawn bonus', gaussian * 0.05, operation 1, saved), spawnEntityInWorld, playLivingSound; a named egg names the mob (shown in its spawn packets, which write the data watcher out late); used up outside creative, stat.useItem.383; /summon without a data tag runs onInitialSpawn; S0FPacketSpawnMob truncates its angles. Not yet: eggs of the other mobs, eggs on mob spawners, dispensers"
scenarios = ["play/spawn_eggs"]

[[feature]]
id = "item.potions"
description = "Potions: drinking (32 updates, drink sounds, status 9) with effects from PotionHelper.getPotionEffects (port checked against every damage value) or CustomPotionEffects, the empty bottle (in the slot or added elsewhere; none in creative), glass bottles filled at water (in creative too, the water bottle added or tossed). Not yet: splash potions, brewing"
scenarios = ["play/potions"]

[[feature]]
id = "blocks.brewing_stands"
description = "Brewing stands: placing (ItemReed), the window (minecraft:brewing_stand, brew time property, stat.brewingstandInteraction), slot rules and shift-click, TileEntityBrewingStand.update (400-tick brews, canBrew / brewPotions with vanilla's cached-list identity, PotionHelper.applyIngredient, the unsaved ingredient), the bottle bits on the block, contents dropped when broken. Not yet: hoppers, comparators, the potion achievement"
scenarios = ["play/brewing"]

[[feature]]
id = "entities.dead_body"
description = "A dead player's experience dropping as orbs after 20 updates; the body leaving the entity list but staying among the world's players until it respawns (new entities are spawned to it, orbs fly to it as the closest player)"
scenarios = ["play/death_xp_orbs"]

[[feature]]
id = "scoreboard.stat_criteria"
description = "Statistic criteria: scores change the moment the statistic does (a jump, a dropped item after it spawns, a death), stat.timeSinceDeath scores reset to 0 on death and stop counting while dead"
scenarios = ["commands/stat_scores"]

[[feature]]
id = "combat.effects"
description = "Combat details: critical hits (attacker falling, crit animation), sprint attacks (extra knockback, sprinting stops), fire aspect (fire counter, the burning flag following on the victim's own update), thorns above level 10 (damage, damage.thorns sound heard by all but the attacker, armor wear)"
scenarios = ["play/pvp_effects"]

[[feature]]
id = "combat.fall_messages"
description = "Fall death messages: a fatal fall after hits by a player (plain, named sword) or by instant damage is still an accident (the fatal hit clears the earlier combat entries); respawned players keep their entity id and move to the end of the player list (latency updates)"
scenarios = ["play/fall_messages"]

[[feature]]
id = "blocks.banners"
description = "Banners: standing (rotation) and wall placement from the item with its base color and patterns, the tile entity and its description packet, survival harvest drop (Base and Patterns), the wall banner popping off with its whole tile entity"
scenarios = ["play/banners"]

[[feature]]
id = "blocks.flower_pots"
description = "Flower pots: placement (ItemReed, solid top below), potting a plant (stat.flowerPotted, description packet), a full pot refusing another plant, the plant dropping before the pot when mined and after it when the pot pops off"
scenarios = ["play/flower_pots"]

[[feature]]
id = "blocks.cauldrons"
description = "Cauldrons: placement (ItemReed), water bucket, bottles (inventory resent), washing dyed leather armor and banner patterns, clicks that change nothing, the levels sent to the client. Not in a scenario: rain, putting out burning players, comparators"
scenarios = ["play/cauldrons"]

[[feature]]
id = "blocks.rails"
description = "BlockRailBase, BlockRail, BlockRailPowered, BlockRailDetector: placing with onBlockAdded (shapes from the neighbors that would connect, the neighbors bent towards the new rail), a curve, a slope up to a rail a block higher, a T-junction, powered rails passing power along 8 rails from a redstone block (the ninth on stays off), activator rails, losing power when the source goes, a detector rail with no minecart, a rail popping off without its support; /fill counting rails that reshaped themselves. Not yet in a scenario: placing by players, T-junctions decided by power, slopes losing their high side, detector rails with minecarts"
scenarios = ["play/rails"]

[[feature]]
id = "entity.minecarts"
description = "EntityMinecart (rideable): ItemMinecart.onItemUse on a rail, spawn object 10 with the minecart type as data, metadata in DataWatcher HashMap order (17-22 between 0-4); five quick hits (wobble direction and amplitude, damage up 10 a point and down 1 a tick, broken past 40, the minecart item dropped); a cart kicked off a powered rail by a stone block, boosted, running over plain rails and a detector rail (powered while the cart is on it, off 20 ticks after it leaves), bumping into a resting cart (both lined up: the motion shared), stopped by an unpowered powered rail and the glass at the end; the carts saved with their chunk (Motion -0.0 kept). Not yet in a scenario: players pushing carts, slopes, derailing, fire, water, explosions, projectiles, creative players, named carts, activator rails, loading, /tp"
scenarios = ["play/minecarts"]

[[feature]]
id = "entity.riding"
description = "Players riding minecarts: interacting with a cart gets in (Attach Entity to the rider, a teleport where it stands), the rider sits on the cart (y - 0.35), riding a cart launched by a powered rail and braked to a stop, the unmount input getting out (a teleport to a free spot next to the cart, Attach Entity -1, another teleport), getting back in; the cart saved in the player's data (Riding) and not with its chunk; after a restart the player joins in the cart (spawned at once, Attach Entity, a teleport); the minecart distance stat. Not yet in a scenario: viewers seeing a rider (attach every 60 updates, looks only, the teleport after getting off), sneaking out, carts breaking under a rider, activator rails, a rider pushing forward, logging out while riding"
scenarios = ["play/riding"]

[[feature]]
id = "entity.container_minecarts"
description = "EntityMinecartChest and EntityMinecartHopper: placed by ItemMinecart (spawn object 10, types 1 and 5); interacting opens a chest or hopper window titled with the cart's display name (translation, show_entity hover, UUID insertion); shift-clicks in and out; a hopper under a chest cart pulling its items (getInventoryAtPosition's entity search); a hopper cart off on a powered activator rail, then pulling a chest's items above it one a tick; a comparator reading a chest cart on a detector rail (on with items, off once the cart is gone); the chest cart broken by a sword (contents spilled, a minecart and a chest dropped); the carts saved with their chunk (Items, TransferCooldown). Not yet in a scenario: hopper carts picking up item entities, hoppers pushing into carts, droppers, spectators, /kill spilling the contents, drag by fullness, named carts, loading"
scenarios = ["play/container_minecarts"]

[[feature]]
id = "entity.furnace_minecarts"
description = "EntityMinecartFurnace: placed by ItemMinecart (spawn object 10, type 2); fed coal by a player (3600 ticks of fuel, the coal used up, metadata 16 burning) and pushing itself away from the player along the rail at 0.2 a tick with its own drag; bumping into a rideable cart (furnace collision sharing: the other cart takes its motion, the furnace cart keeps 95%) and pressing it against glass; interacted without coal (no fuel, the push dropped); broken by a sword (a minecart and a furnace dropped); saved with its chunk (PushX, PushZ, Fuel). Not yet in a scenario: the fuel running out, the push dropped when moving against it, explosions (no furnace dropped), two furnace carts colliding, the fuel wrapping when saved, creative players feeding coal, loading"
scenarios = ["play/furnace_minecarts"]

[[feature]]
id = "entity.tnt_minecarts"
description = "EntityMinecartTNT: placed by ItemMinecart (spawn object 10, type 3); broken at rest by a sword (a minecart and TNT dropped, no explosion); lit by its activator rail getting powered (entity status 10, game.tnt.primed) and exploding 80 ticks later with strength 4 at rest, sparing rails and the blocks under them (getExplosionResistance and verifyExplosion of a lit cart); exposure 0 for entities around a blast centered inside a rail (a second TNT cart wobbling but surviving, the player taking the minimum damage); the surviving cart saved with its chunk (TNTFuse). Not yet in a scenario: crashing, falling, fire, explosions and burning arrows setting carts off, moving carts breaking, chain reactions, loading"
scenarios = ["play/tnt_minecarts"]

[[feature]]
id = "entity.boats"
description = "EntityBoat and ItemBoat: placed by using a boat at the grass or water in sight (spawn object 1, metadata, facing away from the player); a boat on grass resting and broken by a sword (the boat dropped); a boat on water floating (bobbing), ridden (Attach Entity, a teleport), steered forward (speed multiplier, turning towards where it goes) into a bank below the crash speed, left with the unmount input; the boat distance stat; saved with its chunk. Not yet in a scenario: crashes and hard landings (planks and sticks), lily pads and snow, boats pushing each other, players walking on and into boats, fire and lava, creative players breaking boats, the rider's projectiles, Riding tags with boats, loading"
scenarios = ["play/boats"]
