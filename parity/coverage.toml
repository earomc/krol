[[feature]]
id = "entities.falling_blocks"
description = "Falling sand and gravel: scheduled checks on placement and neighbor changes, falling block entities (tracking, physics, landing, dropping as items), instant fall in unloaded areas. Not yet: anvils, dragon eggs"
scenarios = ["play/falling_blocks"]

[[feature]]
id = "redstone.basics"
description = "Redstone power queries (strong/weak, normal cubes relaying), redstone wire (power levels, connections, update order via HashSet<BlockPos> order), redstone torches (delay, burnout), lamps; levers, buttons and redstone blocks as sources. Not yet: repeaters, comparators, pistons, power-driven doors and the other consumers"
scenarios = ["play/redstone_basics"]

[[feature]]
id = "redstone.repeaters"
description = "Repeaters: placement facing away from the player, delay cycling, delays and tick priorities, locking by powered side repeaters, output to the front, block update marking after onBlockAdded/breakBlock"
scenarios = ["play/repeaters"]

[[feature]]
id = "redstone.doors"
description = "Doors, trapdoors and fence gates opened and closed by redstone (powered bits, effects 1003/1006), doors and trapdoors breaking without support, door halves breaking together, doors dropping from the lower half"
scenarios = ["play/powered_doors"]

[[feature]]
id = "redstone.comparators"
description = "Comparators: compare/subtract modes, side inputs, reading chests (whole double chest, nothing when blocked) and furnaces directly or through a cube, output signal tile entity, scheduled updates, containers updating nearby comparators. Not yet: hoppers, dispensers, brewing stands, jukeboxes, cauldrons, cake, end portal frames, item frames"
scenarios = ["play/comparators"]

[[feature]]
id = "redstone.pistons"
description = "Pistons and sticky pistons: structure helper (12-block limit, slime blocks, destroyable blocks), block events, moving blocks with tile entities, heads, quasi-connectivity, sounds. Not yet: moving entities"
scenarios = ["play/pistons"]

[[feature]]
id = "redstone.note_blocks"
