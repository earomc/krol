description = "Falling sand, gravel and anvils: scheduled checks on placement and neighbor changes, falling block entities (tracking, physics, landing, dropping as items), instant fall in unloaded areas, anvils crushing circuits blocks, hurting entities (death.attack.anvil), being damaged or shattering on landing, the landing sound, no fall on farmland. Not yet: dragon eggs, short anvil falls (unseeded damage roll)"
