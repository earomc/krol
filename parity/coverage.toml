description = "Hoppers: pulling from the inventory above or item entities, pushing into the inventory they face (furnace sides, double chests, other hoppers), 8-tick cooldown, redstone lock, window, comparator signal, contents dropped when broken; pulling from a chest minecart above (play/container_minecarts). Not yet: dispensers, droppers, brewing stands, pushing into minecarts"
