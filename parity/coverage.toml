scenarios = ["play/silk_fortune"]

[[feature]]
id = "blocks.special_drops"
description = "Block drops by dropBlockAsItemWithChance (no fortune) with World.rand pinned: crops with their extra seed rolls and the poisonous potato roll, stem seed rolls, nether wart, sugar cane, string from tripwire and cobwebs, nothing from vines, stained glass, packed ice; wall and anvil variants; the chance rolls of blocks dropping nothing (end portal frame, dead bush, glass pane); quantity rolls of glowstone, melon, tall grass, redstone ore (with experience) and sea lanterns. Not yet: moving pistons' blocks, skulls"
scenarios = ["play/block_drops_pinned"]

[[feature]]
id = "commands.fill"
description = "/fill: the box in z, y, x order, block updates after the whole box, destroy mode (drops, effect), the success count and 'No blocks filled'. Not yet in a scenario: hollow, outline, keep, replace filters, data tags, tooManyBlocks"
