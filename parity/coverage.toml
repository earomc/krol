[[feature]]
id = "redstone.pistons"
description = "Pistons and sticky pistons: structure helper (12-block limit, slime blocks, destroyable blocks), block events, moving blocks with tile entities, heads, quasi-connectivity, sounds. Not yet: moving entities"
