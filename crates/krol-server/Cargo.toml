[package]
name = "krol-server"
description = "krol game server: configuration, game logic and connection handling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
krol-java = { path = "../krol-java" }
krol-nbt = { path = "../krol-nbt" }
krol-protocol = { path = "../krol-protocol" }
krol-world = { path = "../krol-world" }
md5 = { package = "md-5", version = "0.11" }
rsa = { version = "0.10", features = ["pkcs1v15"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
sha1 = "0.11"
ureq = "3"
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
